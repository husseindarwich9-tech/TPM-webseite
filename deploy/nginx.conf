# nginx-Vorlage für die TPM-Webseite auf dem eigenen Hetzner-Server.
# Den Inhalt von dist/ nach /var/www/tpm-bau kopieren (siehe README).
# TLS-Zertifikate z. B. mit certbot (Let's Encrypt) erzeugen und Pfade anpassen.
#
# HTTP/2: Die Schreibweise "listen 443 ssl http2;" funktioniert mit jedem nginx (auch 1.18–1.24, wie in
# Ubuntu 22.04/24.04). Ab nginx 1.25.1 erscheint dafür nur ein Hinweis; dort kann man stattdessen
# "listen 443 ssl;" und eine eigene Zeile "http2 on;" schreiben.
# Getestet mit nginx 1.24: nginx -t fehlerfrei, Header und Umleitungen geprüft.

server {
  listen 80;
  listen [::]:80;
  server_name tpm-bau.de www.tpm-bau.de;
  return 301 https://www.tpm-bau.de$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tpm-bau.de;
  ssl_certificate     /etc/letsencrypt/live/tpm-bau.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tpm-bau.de/privkey.pem;
  return 301 https://www.tpm-bau.de$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.tpm-bau.de;

  ssl_certificate     /etc/letsencrypt/live/tpm-bau.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tpm-bau.de/privkey.pem;

  root /var/www/tpm-bau;
  index index.html;
  charset utf-8;

  # Kompression
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/xml application/manifest+json application/json text/plain;

  # Sicherheits-Header (keine Cookies, keine Fremd-Skripte).
  # WICHTIG: nginx vererbt add_header NICHT in einen location-Block, der selbst add_header enthält.
  # Deshalb stehen die Sicherheits-Header unten in JEDEM location-Block noch einmal vollständig.
  # Wer hier etwas ändert, muss es in allen location-Blöcken ändern.
  # connect-src: Domain des Anfrage-Webhooks eintragen (z. B. https://automation.example.de)

  # Dateien mit Hash im Namen und Schriften: lange cachen
  location ~* ^/(_astro|fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  # Web-App-Manifest mit dem richtigen Dateityp ausliefern
  location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Seiten und alle übrigen Dateien: immer aktuell
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://automation.example.de; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
