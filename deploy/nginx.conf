# nginx-Vorlage für die TPM-Webseite auf dem eigenen Hetzner-Server.
# Den Inhalt von dist/ nach /var/www/tpm-bau kopieren (siehe README).
# TLS-Zertifikate z. B. mit certbot (Let's Encrypt) erzeugen und Pfade anpassen.

server {
  listen 80;
  listen [::]:80;
  server_name tpm-bau.de www.tpm-bau.de;
  return 301 https://www.tpm-bau.de$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name tpm-bau.de;
  ssl_certificate     /etc/letsencrypt/live/tpm-bau.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tpm-bau.de/privkey.pem;
  return 301 https://www.tpm-bau.de$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.tpm-bau.de;

  ssl_certificate     /etc/letsencrypt/live/tpm-bau.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tpm-bau.de/privkey.pem;

  root /var/www/tpm-bau;
  index index.html;
  charset utf-8;

  # Kompression
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/xml application/manifest+json application/json text/plain;

  # Sicherheits-Header (keine Cookies, keine Fremd-Skripte)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # connect-src: Domain des Anfrage-Webhooks eintragen (z. B. https://automation.example.de)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://automation.example.de; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  # Dateien mit Hash im Namen und Schriften: lange cachen
  location ~* ^/(_astro|fonts)/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Seiten: immer aktuell
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
